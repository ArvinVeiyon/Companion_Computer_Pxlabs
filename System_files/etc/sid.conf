#Period covered: 18/04/2026 - 15/08/2026. Rover autonomy stack brought up.

#=== READ FIRST: ONE SYSTEM, TWO AIRFRAMES ===
# The ROVER and the DRONE share BOTH the flight controller AND this companion computer. They are
# physically MOVED between airframes (companion moved drone -> rover 17/04/2026, see v2.1).
# This file is therefore the changelog for ONE image serving BOTH vehicles, NOT a rover-only log.
# Everything below was done with the hardware on the ROVER. Before it flies again, work the
# BEFORE-FLIGHT REVERT CHECKLIST at the end of this entry.
# Param scope: RO_* are rover-airframe-only and safe to leave. EKF2_* and sensor calibration are
#   SHARED WITH THE DRONE. CA_AIRFRAME is currently 6 (Rover, differential).
# Refs: setup_manual.md A1 + A7 (EKF2_* block), autonav_reference.md section 1 scope boundary.

#--- ROVER AUTONOMY: 6 new systemd units (added 22/07, 01/08) ---
# rover-odometry / rover-ekf-bridge / rover-autonav-mode / rover-camera / rover-scan / rover-scan-3d
# 5 of the 6 are ENABLED, so they start on boot on WHATEVER AIRFRAME this companion is bolted to.
#   Only rover-ekf-bridge is disabled. See the revert checklist before flight.
# rover-ekf-bridge is DISABLED ON PURPOSE - wheels-up limit-cycle hazard. Start it manually on the
#   FLOOR before every AutoNav run (it is the only source of the local velocity estimate indoors),
#   stop it after. Signature if missing: mode refused ARMED but accepted DISARMED.
# AutoNav is a PX4 EXTERNAL mode (main=4 sub=11) with NO RC switch slot: arm in Manual (throttle
#   neutral), then the companion sends DO_SET_MODE.
# rover_odometry = wheel ERPM + camera-gyro dead reckoning. THERE IS NO VIO. erpm_to_ms = 0.003900,
#   tape-validated 12/08 - do NOT "correct" it.
# Heading comes from the CAMERA GYRO, not the FC. FC fused yaw is unusable indoors (bmm350 / GPS
#   suspects, both still untested - and BOTH suspects are EKF2_*, i.e. SHARED WITH THE DRONE).

#--- PERCEPTION / SAFETY (rover only) ---
# Reflex collision-stop runs in the AutoNav executor; tests the corridor the body sweeps
#   (bumper-referenced), not an angular cone.
# 10/08 FAIL-OPEN CLOSED: perception-health gate (min_valid_fraction 0.35) now runs BEFORE the
#   clearance test. An empty-but-fresh scan used to read as "clear" and drove the rover into a wall.
# Standoff tape-confirmed 0.345 m (n=3). /scan scale 0.9845, front_overhang 0.337 (reads short =
#   reflex fires early = safe).
# S1 kill-switch in AutoNav PASSED 22/07, re-confirmed 10/08. S2 stands + S2 floor PASSED.
# 3D obstacle layer + height-aware scan from the depth cloud (/scan_3d, running in parallel to /scan).
# NOTE: none of this collision logic covers the DRONE, and none of it covers MANUAL drive.

#--- MAPPING (rover only) ---
# RTAB-Map indoor mapping fits on the Pi. Reference map ~/house_map_v4.db, scale tape-verified.
# RTAB-Map relocalization replaces AMCL - it consumes our TF odom and publishes map->odom.
# Localization accuracy is NOT measured yet; both 09/08 attempts were invalid. Do not quote a figure.

#--- KNOWN OPEN FAULTS - the rover is NOT speed-safe ---
# SPEED COMMANDS ARE NOT HONOURED: 0.05 -> 0.140 m/s, 0.25 -> ~0.9 m/s. Floor ~0.14 m/s is
#   RO_SPEED_TH (0.10): firmware zeroes speed feedback below it, so the loop believes it stopped and
#   re-accelerates. STRUCTURAL, not a tuning error. RO_* = rover-only, does not touch the drone.
# ESC zero-dropout: ~24% odometry under-read at crawl, severity varies per ESC. Open.
# GATE EVERY MOVING TEST ON MEASURED SPEED, NEVER THE COMMANDED VALUE.

#--- PX4 PARAMETERS ---
# 14/08: RO_DECEL_LIM / RO_ACCEL_LIM / RO_SPEED_LIM change caused a HARD WALL HIT IN MANUAL DRIVE.
#   ALL THREE REVERTED. RO_ACCEL_LIM/RO_DECEL_LIM also slew the MANUAL stick - with them set,
#   centring the stick no longer stops the rover (~1.2 s powered ramp-down). Keep both at -1.
#   A rover param is scoped by flag_control_*_enabled, NOT by its description.
# No EKF2_* value has been changed by us to date - they are as-found. The queued yaw-fault tests
#   (EKF2_MAG_TYPE=5, EKF2_GPS_CTRL=0) WOULD change shared params: revert before flight and record it.
# Audit + change log: ~/ros2_ws/docs/px4_param_audit.md and setup_manual.md A7. Read before
#   calling any param untraced.
# tools/set_param.py reads/writes params from the companion, but writes RAM ONLY - finish with
#   'param save' or a reboot restores the old values.

#--- CAMERA / VIDEO (companion - follows the hardware to either airframe) ---
# vision_streaming: ffmpeg watchdog, hung-alive and degraded-stream detection; capture node resolved
#   by sysfs index, never by /dev/videoN.
# LG Smart Cam is the current FPV camera. vision_streaming has been STOPPED since 08/08.
# Orbbec unaligned-depth guard patched (codex-work 16665f5). A re-clone of the gitignored Orbbec
#   tree RESTORES the bug.
# WFB-NG channel is 161 (changed 17/04, v2.1). Shared link infrastructure, applies to either airframe.

#--- HOUSEKEEPING ---
# AIDE timer disabled (was ~3.5 h/day of a core).
# ldlidar.service added 17/04 (STL-19, outdoor track), currently disabled. ext5v-logger added 25/07.

#=== BEFORE-FLIGHT REVERT CHECKLIST (companion/FC going back on the DRONE) ===
# NOT YET VALIDATED AS A PROCEDURE - setup_manual.md F6 (the drone revert checklist) is an
# ACKNOWLEDGED UNWRITTEN GAP. Treat the list below as the starting point, not a signed-off procedure.
# 1. systemctl enable --now tfmini      <- REQUIRED BY THE DRONE, currently DISABLED for the rover.
# 2. Disable the 5 enabled rover-* units, or they start on the drone at boot
#      (rover-odometry, rover-autonav-mode, rover-camera, rover-scan, rover-scan-3d).
# 3. CA_AIRFRAME is 6 (Rover, differential) - the aerial airframe config must be restored.
#      HOW this swap is performed is NOT DOCUMENTED. Establish it before the next flight.
# 4. Revert any EKF2_* changed for the rover (none as of this release - re-check A7 at the time).
# 5. RO_* need NOT be reverted; they are rover-airframe-only. Do not "revert" them by mistake.
# 6. Re-read all params AFTER an FC reboot - they have not always survived one (setup_manual A7).

