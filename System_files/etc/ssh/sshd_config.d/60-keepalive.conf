# Reap SSH sessions whose link has died. Added 2026-09-04.
#
# WHY: this box is normally reached over WFB (radio) or through the relay's
# autossh tunnel, and when that link drops the server side does not notice --
# sshd sat on the default ClientAliveInterval 0, meaning "never probe". The
# session, its shell, and anything running in it stay parked until TCP itself
# gives up, which is why a reconnect could land on a half-dead shell and why
# stale sshd processes accumulated after a radio outage.
#
# 30 s x 4 missed probes => a dead peer is dropped in about 2 minutes.
# These are ENCRYPTED, in-channel probes (not TCPKeepAlive, which is already on
# and is spoofable/unencrypted), so they also keep NAT and the relay tunnel
# from timing the connection out while it is genuinely idle.
#
# ⚠️ This reaps the SESSION, not the WORK. Anything that must survive a link
# loss has to be started inside tmux -- `tmux new -As rover` -- or it dies with
# the session, faster now than before.

ClientAliveInterval 30
ClientAliveCountMax 4
