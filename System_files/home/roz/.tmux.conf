# tmux configuration for Vind-Roz. Added 2026-09-04.
#
# WHY: this box is reached over WFB or the relay's autossh tunnel, and both drop.
# A bare SSH shell takes its work down with it -- a bag recording, a replay-map,
# a floor test. Run those inside tmux instead:
#
#     tmux new -As rover      # attach to "rover", create it if it is not there
#     <start the long job>
#     ...link dies, the job keeps running...
#     tmux attach -t rover    # after reconnecting
#
# Tuned for reading test output on a flaky link, not for heavy tmux use.

# Long scrollback: perception and test tools print a lot, and after a reconnect
# the scrollback is the only record of what happened while the link was down.
set -g history-limit 50000

# Mouse on: wheel-scroll the scrollback, click to switch pane.
# NOTE this changes selection -- to copy with the terminal's own selection,
# hold Shift while dragging.
set -g mouse on

# Reattaching from a different machine (laptop at the rover instead of the GCS)
# means a different terminal size. Resize to the attached client, not to the
# smallest one that ever attached.
setw -g aggressive-resize on

# 1-based numbering: the keys match what the status bar shows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No escape-key delay -- the default 500 ms makes vim and the ROS CLI feel broken.
set -sg escape-time 0

# Status bar: which session, which host, and the time. On a link that drops it
# matters to see at a glance that you are back in "rover" on Vind-Roz and not in
# a fresh shell that will die with the next outage.
set -g status-interval 5
set -g status-left-length 30
set -g status-left '#[bold] #S #[default]| '
set -g status-right '#H | %Y-%m-%d %H:%M '

# Broadly compatible terminal type. The GCS laptop reaches this box through the
# relay tunnel and is not always a modern terminal; screen-256color works
# everywhere that matters here.
set -g default-terminal "screen-256color"
